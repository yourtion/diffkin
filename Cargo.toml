[workspace]
members = [
  "crates/domain",
  "crates/analysis",
  "crates/application",
  "apps/cli",
  "apps/desktop/src-tauri",
]
default-members = ["crates/domain", "crates/analysis", "crates/application", "apps/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2021"
rust-version = "1.97"
publish = false
license = "MIT"

[workspace.dependencies]
diffkin-domain = { path = "crates/domain" }
diffkin-analysis = { path = "crates/analysis" }
diffkin-application = { path = "crates/application" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2.7"
ts-rs = { version = "12", features = ["serde-compat"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
