[package]
name = "diffkin-application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
diffkin-analysis.workspace = true
diffkin-domain.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["raw_value"] }

[lints]
workspace = true

[dependencies.sha1]
version = "0.11"

[dependencies.sha2]
version = "0.10"

# sha2 0.10 gates its Apple Silicon hardware backend behind this feature.
[target.'cfg(all(target_arch = "aarch64", target_os = "macos"))'.dependencies.sha2]
version = "0.10"
features = ["asm"]
