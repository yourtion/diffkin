name: Setup Diffkin
description: Install the pinned toolchains and locked dependencies
inputs:
  target:
    description: Optional Rust cross-compilation target
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: .node-version
        cache: pnpm
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.97.0
        components: rustfmt, clippy
        targets: ${{ inputs.target }}
    - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      with:
        key: ${{ inputs.target }}
    - name: Install Linux desktop dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
    - name: Install JavaScript dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
