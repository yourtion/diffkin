name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: version
        name: Validate manifest versions and release tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            node scripts/version.mjs check "$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF_TYPE" == branch ]]; then
            node scripts/version.mjs check
          else
            exit 1
          fi

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    needs: [version, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      BUNDLES: ${{ matrix.bundles }}
      TAURI_BUNDLER_DMG_IGNORE_CI: "false"
      MACOS_SIGNING_ENABLED: ${{ github.ref_type == 'tag' && vars.MACOS_SIGNING_ENABLED == 'true' }}
      WINDOWS_SIGNING_ENABLED: ${{ github.ref_type == 'tag' && vars.WINDOWS_SIGNING_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: ${{ matrix.target }}
      - name: Build CLI
        run: cargo build -p diffkin-cli --release --locked --target "$TARGET"
      - name: Build and bundle desktop
        if: runner.os == 'Linux' || (runner.os == 'Windows' && env.WINDOWS_SIGNING_ENABLED != 'true')
        run: pnpm desktop build --target "$TARGET" --bundles "$BUNDLES" -- --locked
      - name: Build desktop before signing
        if: runner.os == 'macOS' || (runner.os == 'Windows' && env.WINDOWS_SIGNING_ENABLED == 'true')
        run: pnpm desktop build --target "$TARGET" --no-bundle -- --locked
      - name: Bundle macOS app and sign CLI ad hoc
        if: runner.os == 'macOS' && env.MACOS_SIGNING_ENABLED != 'true'
        run: bash scripts/bundle-macos.sh ad-hoc
      - name: Bundle and notarize macOS release with Developer ID
        if: runner.os == 'macOS' && env.MACOS_SIGNING_ENABLED == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/bundle-macos.sh developer-id
      - name: Install Microsoft Artifact Signing client
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: nuget install Microsoft.ArtifactSigning.Client -Version 1.0.151 -Source https://api.nuget.org/v3/index.json -OutputDirectory $env:RUNNER_TEMP -ExcludeVersion -NonInteractive
      - name: Bundle and sign Windows release
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
        run: ./scripts/bundle-windows.ps1
      - name: Collect installers and CLI
        run: node scripts/release-assets.mjs collect "$TARGET"
      - name: Run CLI from the release archive
        run: |
          stage=$(mktemp -d)
          tar -xzf artifacts/diffkin-cli-*-"$TARGET".tar.gz -C "$stage"
          cli="$stage/diffkin"
          if [[ "$RUNNER_OS" == Windows ]]; then cli="$cli.exe"; fi
          if [[ "$RUNNER_OS" == macOS ]]; then
            codesign --verify --strict --verbose=2 "$cli"
            arch_name=${TARGET%%-*}
            lipo "$cli" -verify_arch "${arch_name/aarch64/arm64}"
            if [[ "$TARGET" == x86_64-* ]] && ! arch -x86_64 /usr/bin/true; then
              echo "Intel CLI verified; this runner cannot execute x86_64 binaries"
              exit 0
            fi
          fi
          "$cli" --version
          "$cli" LICENSE "$stage/LICENSE" > /dev/null
      - name: Install Windows package and inspect Authenticode
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-Item artifacts/Diffkin-*.exe
          $destination = Join-Path $env:RUNNER_TEMP 'diffkin-installed'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S /D=$destination" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS exited with $($install.ExitCode)" }
          $desktop = Get-Item "$destination/diffkin-desktop.exe"
          foreach ($file in $installer, $desktop) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            Write-Host "$($file.Name) Authenticode = $($signature.Status)"
            if ($env:WINDOWS_SIGNING_ENABLED -eq 'true' -and $signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature on $($file.Name)"
            }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  draft:
    if: github.ref_type == 'tag'
    needs: [version, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts
      - name: Verify complete release and create checksums
        run: node scripts/release-assets.mjs checksums artifacts
      - name: Create or update draft only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          if gh release view "$TAG" --json isDraft > release-state.json 2>/dev/null; then
            node -e 'if (!JSON.parse(require("fs").readFileSync("release-state.json")).isDraft) { throw new Error("Refusing to overwrite a published release"); }'
          else
            options=(--draft --verify-tag --title "Diffkin $TAG" --generate-notes)
            if [ "$PRERELEASE" = true ]; then options+=(--prerelease); fi
            gh release create "$TAG" "${options[@]}"
          fi
          gh release upload "$TAG" artifacts/* --clobber
