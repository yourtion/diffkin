name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: version
        name: Validate tag and manifest versions
        shell: bash
        run: |
          test "$GITHUB_REF_TYPE" = tag || { echo "Release must run against a version tag"; exit 1; }
          node scripts/version.mjs check "$GITHUB_REF_NAME"

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    needs: [version, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      BUNDLES: ${{ matrix.bundles }}
      TAURI_BUNDLER_DMG_IGNORE_CI: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: ${{ matrix.target }}
      - name: Build CLI
        run: cargo build -p diffkin-cli --release --locked --target "$TARGET"
      - name: Build desktop without Apple certificate
        if: runner.os != 'macOS' || vars.MACOS_SIGNING_ENABLED != 'true'
        run: pnpm desktop build --target "$TARGET" --bundles "$BUNDLES" -- --locked
      - name: Build signed and notarized macOS desktop
        if: runner.os == 'macOS' && vars.MACOS_SIGNING_ENABLED == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for key in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            test -n "${!key}" || { echo "Missing signing configuration: $key"; exit 1; }
          done
          pnpm desktop build --target "$TARGET" --bundles "$BUNDLES" -- --locked
      - name: Collect installers and CLI
        run: node scripts/release-assets.mjs collect "$TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  draft:
    needs: [version, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts
      - name: Verify complete release and create checksums
        run: node scripts/release-assets.mjs checksums artifacts
      - name: Create or update draft only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          if gh release view "$TAG" --json isDraft > release-state.json 2>/dev/null; then
            node -e 'if (!JSON.parse(require("fs").readFileSync("release-state.json")).isDraft) { throw new Error("Refusing to overwrite a published release"); }'
          else
            options=(--draft --verify-tag --title "Diffkin $TAG" --generate-notes)
            if [ "$PRERELEASE" = true ]; then options+=(--prerelease); fi
            gh release create "$TAG" "${options[@]}"
          fi
          gh release upload "$TAG" artifacts/* --clobber
