name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm check
      - run: pnpm protocol:check
      - run: pnpm build
      - name: Install browser test dependencies
        if: runner.os == 'Linux'
        run: pnpm --filter @diffkin/desktop exec playwright install --with-deps chromium
      - name: Generate real-kernel review fixtures
        if: runner.os == 'Linux'
        run: cargo run -p diffkin-analysis --example ui_fixture --locked > target/ui-fixture.json
      - name: Generate real workspace and validation fixtures
        if: runner.os == 'Linux'
        run: cargo run -p diffkin-desktop --example workflow_fixture --locked > target/workflow-fixture.json
      - name: Test review interface
        if: runner.os == 'Linux'
        run: pnpm test:ui
        env:
          DIFFKIN_KERNEL_FIXTURE: ${{ github.workspace }}/target/ui-fixture.json
          DIFFKIN_WORKFLOW_FIXTURE: ${{ github.workspace }}/target/workflow-fixture.json
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
